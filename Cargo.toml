[package]
name = "amphion"
version = "0.7.2"
edition = "2021"
authors = ["Darwin Sin"]
description = "Amphion - Spotify Web Player con temas y bloqueo de publicidad para Linux Mint Cinnamon"

[dependencies]
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
